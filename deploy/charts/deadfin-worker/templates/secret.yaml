{{- if and (not .Values.token.existingSecret) .Values.token.value }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "deadfin-worker.fullname" . }}-token
  labels:
    {{- include "deadfin-worker.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.token.key }}: {{ .Values.token.value | quote }}
{{- else if not .Values.token.existingSecret }}
{{- fail "set token.existingSecret or token.value" }}
{{- end }}
